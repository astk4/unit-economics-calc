<table>
    <tr>
        @for (item of colTitles; track item) {
            <th [innerHTML]="item"></th>
        }
    </tr>
    <tr>
       @for (item of getColumsRange(); track item) {
            <td>
                <input type="number" #unit min="1" max="1000000">
            </td>
        } 
    </tr>
</table>
