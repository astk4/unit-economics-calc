name: Angular Build
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install Angular Dependencies
        run: npm install
      - name: Build Angular Application
        run: npx ng build --configuration=production --base-href=/unit-economics-calc/
      - name: Check build directory structure
        run: ls -R dist/
      - name: Upload static files to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist/unit-economy-calc/browser/'
  
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: '${{ steps.deployment.outputs.page_url }}'
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
